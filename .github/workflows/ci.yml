name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Audit production dependencies
        run: npm run audit:prod
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Check source licenses
        run: npm run license:check
      - name: Check types and Svelte
        run: npm run check
      - name: Lint
        run: npm run lint

  vitest:
    name: Vitest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build production application
        run: npm run build

  browser-functional:
    name: Browser functional (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1/4
            port: 4173
            output_id: shard-1
          - shard: 2/4
            port: 4174
            output_id: shard-2
          - shard: 3/4
            port: 4175
            output_id: shard-3
          - shard: 4/4
            port: 4176
            output_id: shard-4
    env:
      PLAYWRIGHT_PORT: ${{ matrix.port }}
      PLAYWRIGHT_OUTPUT_ID: ${{ matrix.output_id }}
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        run: npx playwright test --config playwright.functional.config.ts --shard=${{ matrix.shard }}
      - name: Upload failed Playwright traces
        if: failure() && hashFiles('test-results/**') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces-${{ matrix.output_id }}
          path: test-results/browser-functional-${{ matrix.output_id }}/
          retention-days: 3

  real-auth:
    name: Real authentication
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:real-auth
      - if: always() && hashFiles('test-results/auth-real-artifacts/**') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          { name: real-auth-artifacts, path: test-results/auth-real-artifacts/, retention-days: 14 }

  browser-evidence:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:evidence
      - if: always() && hashFiles('test-results/browser-evidence/**', 'output/playwright/**') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-evidence
          path: |
            test-results/browser-evidence/
            output/playwright/
          retention-days: 14

  authorization-stress:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run test:auth:stress
      - if: always() && hashFiles('test-results/auth-stress.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          {
            name: authorization-stress-summary,
            path: test-results/auth-stress.json,
            retention-days: 14,
          }

  package-smoke:
    name: Package smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test packed executable
        run: npm run test:package

  release:
    name: Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'dyne/gestalt-mobile'
    needs: [quality, vitest, build, browser-functional, package-smoke, real-auth]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: gestalt-mobile-main-release
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Check out verified main commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Set up Node.js for npm
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: npm ci
      - name: Verify package identity
        run: test "$(node --print "require('./package.json').name")" = "gestalt-mobile"
      - name: Inspect bootstrap state
        id: bootstrap
        run: node scripts/inspect-release.mjs bootstrap
      - name: Calculate conventional semantic version
        id: semver
        if: steps.bootstrap.outputs.mode == 'semver'
        uses: ietf-tools/semver-action@c90370b2958652d71c06a3484129a4d423a6d8a8 # v1.11.0
        with:
          token: ${{ github.token }}
          branch: main
          noNewCommitBehavior: silent
          noVersionBumpBehavior: silent
      - name: Find partial release repair target
        id: repair
        if: steps.bootstrap.outputs.target == '' && steps.semver.outputs.nextStrict == ''
        run: node scripts/inspect-release.mjs repair-target
      - name: Select target version
        id: target
        env:
          BOOTSTRAP_TARGET: ${{ steps.bootstrap.outputs.target }}
          SEMVER_TARGET: ${{ steps.semver.outputs.nextStrict }}
          REPAIR_TARGET: ${{ steps.repair.outputs.target }}
        run: |
          target="${BOOTSTRAP_TARGET:-${SEMVER_TARGET:-$REPAIR_TARGET}}"
          echo "version=$target" >> "$GITHUB_OUTPUT"
      - name: Apply release version
        if: steps.target.outputs.version != ''
        run: npm version "${{ steps.target.outputs.version }}" --no-git-tag-version --allow-same-version
      - name: Verify release payload
        if: steps.target.outputs.version != ''
        run: |
          npm run prepack
          npm pack --dry-run --json --ignore-scripts > "$RUNNER_TEMP/package-contents.json"
          node scripts/check-package-contents.mjs "$RUNNER_TEMP/package-contents.json"
          npm run test:package
      - name: Inspect target release state
        id: state
        if: steps.target.outputs.version != ''
        run: node scripts/inspect-release.mjs target "${{ steps.target.outputs.version }}"
      - name: Publish npm package
        if: steps.state.outputs.publish == 'true'
        run: |
          npm install -g npm@latest
          npm publish . --tag latest
      - name: Create and push exact release tag
        if: steps.state.outputs.tag == 'true'
        env:
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "v$VERSION" "$GITHUB_SHA" --message "Gestalt Mobile v$VERSION"
          git push origin "refs/tags/v$VERSION"
      - name: Create GitHub Release
        if: steps.state.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.target.outputs.version }}
        run: gh release create "v$VERSION" --target "$GITHUB_SHA" --generate-notes --latest
